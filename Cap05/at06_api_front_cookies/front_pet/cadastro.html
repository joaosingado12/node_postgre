<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Sistema</title>
  <link rel="stylesheet" href="./src/css/global.css">
  <style>
    /* Estilos extras específicos para estruturar os campos de cadastro em duas colunas */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .full-width {
      grid-column: span 2;
    }
    .login-box.cadastro {
      max-width: 600px; /* Alarga a caixa para acomodar as duas colunas */
    }
    .link-login {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .link-login:hover { color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box cadastro">
      <h2>Criar Conta</h2>
      <p class="subtitle">Preencha seus dados para acessar o sistema</p>
      
      <form id="cadastro-form">
        <div class="form-grid">
          <!-- Linha 1 -->
          <div class="input-group full-width">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" required placeholder="Digite seu nome">
          </div>

          <!-- Linha 2 -->
          <div class="input-group">
            <label for="cpf">CPF *</label>
            <!-- maxlength em 14 para acomodar os pontos e o traço visualmente -->
            <input type="text" id="cpf" required maxlength="14" placeholder="000.000.000-00">
          </div>
          <div class="input-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" required placeholder="seu@email.com">
          </div>

          <!-- Linha 3 -->
          <div class="input-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="Opcional">
          </div>
          <div class="input-group">
            <label for="whatsapp">WhatsApp</label>
            <input type="text" id="whatsapp" placeholder="Opcional">
          </div>

          <!-- Linha 4 -->
          <div class="input-group full-width">
            <label for="senha">Senha *</label>
            <input type="password" id="senha" required placeholder="Crie uma senha forte">
          </div>
        </div>

        <div id="mensagem-erro" class="mensagem erro oculta"></div>
        <div id="mensagem-sucesso" class="mensagem sucesso oculta"></div>

        <button type="submit" id="btn-submit">Finalizar Cadastro</button>
      </form>
      
      <a href="./index.html" class="link-login">Já tem uma conta? Faça login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script type="module" src="./src/js/pages/cadastro.js"></script>
</body>
</html>
