<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sistema</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>Bem-vindo de volta</h2>
      <p class="subtitle">Acesse o painel do instrutor</p>
      
      <form id="login-form">
        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="Digite seu e-mail">
        </div>
        
        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="Sua senha">
        </div>

        <div id="mensagem-erro" class="mensagem erro oculta"></div>
        <div id="mensagem-sucesso" class="mensagem sucesso oculta"></div>

        <button type="submit" id="btn-submit">Entrar no sistema</button>
      </form>
    </div>
  </div>
  <!-- Importando o Axios via CDN (ou use o node_modules via import no main.js) -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
